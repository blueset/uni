name: Prebuild and Publish Node.js Bindings Pre-release

on:
  push:
    branches:
      - fork
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC https://docs.npmjs.com/trusted-publishers
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          # Windows
          - os: windows-latest
            arch: x64
            platform: win32
          - os: windows-11-arm
            arch: arm64
            platform: win32
          # macOS
          - os: macOS-15-intel  # Intel
            arch: x64
            platform: darwin
          - os: macos-latest  # Apple Silicon
            arch: arm64
            platform: darwin
          # Linux
          - os: ubuntu-latest
            arch: x64
            platform: linux
          - os: ubuntu-24.04-arm
            arch: arm64
            platform: linux
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install gonacli
        run: go install github.com/wenlng/gonacli@latest
      
      - name: Install gloabl npm dependencies
        if: matrix.platform == 'win32'
        run: npm install --global node-gyp 

      - name: Set Go environment for cross-compilation
        if: matrix.platform == 'win32' && matrix.arch == 'arm64'
        run: |
          echo "GOARCH=arm64" >> $GITHUB_ENV
          echo "CGO_ENABLED=1" >> $GITHUB_ENV
        shell: bash

      - name: Generate gonacli files
        run: gonacli generate
      
      - name: Copy uniaddon_data to uniaddon
        shell: bash
        run: |
          cp -fr uniaddon_data/* uniaddon/
      
      - name: Replace COMMIT_HASH in package.json
        shell: bash
        run: |
          COMMIT_HASH=$(git rev-parse --short=7 HEAD)
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' "s/COMMIT_HASH/${COMMIT_HASH}/g" uniaddon/package.json
          else
            sed -i "s/COMMIT_HASH/${COMMIT_HASH}/g" uniaddon/package.json
          fi
      
      - name: Build with gonacli
        run: gonacli build
      
      - name: Install with gonacli
        run: gonacli install
      
      - name: Setup MSVC (Windows only)
        if: matrix.platform == 'win32'
        run: gonacli msvc
      
      - name: Make with gonacli
        run: gonacli make
      
      - name: Install npm dependencies
        working-directory: ./uniaddon
        run: npm install
      
      - name: Run prebuildify
        working-directory: ./uniaddon
        run: npm run prebuildify -- --arch ${{ matrix.arch }}
      
      - name: Upload prebuilds
        uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ matrix.platform }}-${{ matrix.arch }}
          path: uniaddon/prebuilds/
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@latest
      
      - name: Install gonacli
        run: go install github.com/wenlng/gonacli@latest
      
      - name: Generate gonacli files
        run: gonacli generate
      
      - name: Copy uniaddon_data to uniaddon
        run: |
          cp -fr uniaddon_data/* uniaddon/
      
      - name: Replace COMMIT_HASH in package.json
        run: |
          COMMIT_HASH=$(git rev-parse --short=7 HEAD)
          sed -i "s/COMMIT_HASH/${COMMIT_HASH}/g" uniaddon/package.json
      
      - name: Build with gonacli
        run: gonacli build
      
      - name: Install with gonacli
        run: gonacli install
      
      - name: Make with gonacli
        run: gonacli make
      
      - name: Download all prebuilds
        uses: actions/download-artifact@v4
        with:
          path: uniaddon/prebuilds/
          pattern: prebuilds-*
          merge-multiple: true
      
      - name: Verify prebuilds structure
        run: |
          echo "Prebuilds directory structure:"
          ls -R uniaddon/prebuilds/
      
      - name: Install npm dependencies (no scripts)
        working-directory: ./uniaddon
        run: npm install --ignore-scripts
      
      - name: Publish to npm with nightly tag
        working-directory: ./uniaddon
        run: npm publish --tag nightly --access public
