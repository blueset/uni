name: 'Build and Publish Pre-release'

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches:
      - fork

jobs:
  build-node:
    strategy:
      matrix:
        include:
          # Windows
          - os: windows-latest
            arch: x64
            platform: win32

          # macOS
          - os: macOS-15  # Intel
            arch: x64
            platform: darwin
          - os: macos-latest  # Apple Silicon
            arch: arm64
            platform: darwin
          # Linux
          - os: ubuntu-latest
            arch: x64
            platform: linux
          - os: ubuntu-latest
            arch: arm64
            platform: linux
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'uniaddon_data/package.json'
      
      - name: Install gonacli
        run: go install github.com/wenlng/gonacli@latest
      
      - name: Install global npm dependencies
        if: matrix.platform == 'win32' || (matrix.platform == 'darwin' && matrix.arch == 'arm64')
        run: npm install --global node-gyp 

      - name: Generate gonacli files
        run: gonacli generate
      
      - name: Copy uniaddon_data to uniaddon
        shell: bash
        run: |
          cp -fr uniaddon_data/* uniaddon/
      
      - name: Replace COMMIT_HASH in package.json
        shell: bash
        run: |
          COMMIT_HASH=$(git rev-parse --short=7 HEAD)
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' "s/COMMIT_HASH/${COMMIT_HASH}/g" uniaddon/package.json
          else
            sed -i "s/COMMIT_HASH/${COMMIT_HASH}/g" uniaddon/package.json
          fi
      
      - name: Build with gonacli
        run: gonacli build
      
      - name: Install with gonacli
        run: gonacli install
      
      - name: Setup MSVC (Windows only)
        if: matrix.platform == 'win32'
        run: gonacli msvc
      
      - name: Make with gonacli
        run: gonacli make
      
      - name: Install npm dependencies
        working-directory: ./uniaddon
        run: npm install
      
      - name: Run prebuildify
        working-directory: ./uniaddon
        run: npm run prebuildify -- --arch ${{ matrix.arch }}

      - name: Bundle DLLs (Windows only)
        if: matrix.platform == 'win32'
        run: mv ./uniaddon/*.dll uniaddon/prebuilds/win32-${{ matrix.arch }}/
      
      - name: Upload prebuilds
        uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ matrix.platform }}-${{ matrix.arch }}
          path: uniaddon/prebuilds/
          retention-days: 7

  build:
    name: 'Build and Release'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: write
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@v4'
        with:
          fetch-depth: 0  # Get full history for commit info

      - name: 'Set up Go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: 'Get commit hash'
        id: commit
        run: echo "short_sha=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - name: 'Get version info'
        id: version
        run: |
          tag=$(git tag | tail -n1)
          commit_info=$(git log -n1 --format=' %h %cd' --date='format:%Y-%m-%d')
          echo "version_flags=-ldflags=\"-w -s -X \\\"main.version=$tag$commit_info\\\"\"" >> $GITHUB_OUTPUT

      - name: 'Build for Darwin AMD64'
        env:
          CGO_ENABLED: 0
          GOOS: darwin
          GOARCH: amd64
        run: |
          go build ${{ steps.version.outputs.version_flags }} -o uni-${{ steps.commit.outputs.short_sha }}-darwin-amd64
          gzip uni-${{ steps.commit.outputs.short_sha }}-darwin-amd64

      - name: 'Build for Darwin ARM64'
        env:
          CGO_ENABLED: 0
          GOOS: darwin
          GOARCH: arm64
        run: |
          go build ${{ steps.version.outputs.version_flags }} -o uni-${{ steps.commit.outputs.short_sha }}-darwin-arm64
          gzip uni-${{ steps.commit.outputs.short_sha }}-darwin-arm64

      - name: 'Build for Linux AMD64'
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          go build ${{ steps.version.outputs.version_flags }} -o uni-${{ steps.commit.outputs.short_sha }}-linux-amd64
          gzip uni-${{ steps.commit.outputs.short_sha }}-linux-amd64

      - name: 'Build for Linux ARM'
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm
          GOARM: 7
        run: |
          go build ${{ steps.version.outputs.version_flags }} -o uni-${{ steps.commit.outputs.short_sha }}-linux-arm
          gzip uni-${{ steps.commit.outputs.short_sha }}-linux-arm

      - name: 'Build for Linux ARM64'
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: |
          go build ${{ steps.version.outputs.version_flags }} -o uni-${{ steps.commit.outputs.short_sha }}-linux-arm64
          gzip uni-${{ steps.commit.outputs.short_sha }}-linux-arm64

      - name: 'Build for Windows AMD64'
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64
        run: |
          go build ${{ steps.version.outputs.version_flags }} -o uni-${{ steps.commit.outputs.short_sha }}-windows-amd64.exe
          gzip uni-${{ steps.commit.outputs.short_sha }}-windows-amd64.exe

      - name: 'Build for Windows ARM64'
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: arm64
        run: |
          go build ${{ steps.version.outputs.version_flags }} -o uni-${{ steps.commit.outputs.short_sha }}-windows-arm64.exe
          gzip uni-${{ steps.commit.outputs.short_sha }}-windows-arm64.exe

      - name: 'Build for WASM'
        env:
          CGO_ENABLED: 0
          GOOS: js
          GOARCH: wasm
        run: |
          go build ${{ steps.version.outputs.version_flags }} -o uni-${{ steps.commit.outputs.short_sha }}-wasm.wasm
          gzip uni-${{ steps.commit.outputs.short_sha }}-wasm.wasm
      
      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: builds
          path: uni-*.gz
          retention-days: 7
  publish-npm:
    needs: 
    - build-node
    if: contains(github.event.head_commit.message, '[ship npm]')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: 'uniaddon_data/package.json'

      - name: Update npm
        run: npm install -g npm@latest
      
      - name: Install gonacli
        run: go install github.com/wenlng/gonacli@latest
      
      - name: Generate gonacli files
        run: gonacli generate
      
      - name: Copy uniaddon_data to uniaddon
        run: |
          cp -fr uniaddon_data/* uniaddon/
      
      - name: Replace COMMIT_HASH in package.json
        run: |
          COMMIT_HASH=$(git rev-parse --short=7 HEAD)
          sed -i "s/COMMIT_HASH/${COMMIT_HASH}/g" uniaddon/package.json
      
      - name: Build with gonacli
        run: gonacli build
      
      - name: Install with gonacli
        run: gonacli install
      
      - name: Make with gonacli
        run: gonacli make
      
      - name: Download all prebuilds
        uses: actions/download-artifact@v4
        with:
          path: uniaddon/prebuilds/
          pattern: prebuilds-*
          merge-multiple: true
      
      - name: Verify prebuilds structure
        run: |
          echo "Prebuilds directory structure:"
          ls -R uniaddon/prebuilds/
      
      - name: Install npm dependencies (no scripts)
        working-directory: ./uniaddon
        run: npm install --ignore-scripts
      
      - name: Publish to npm with nightly tag
        working-directory: ./uniaddon
        run: npm publish --tag nightly --access public

  publish-github:
    needs:
    - build
    - build-node
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@v4'
        with:
          fetch-depth: 0  # Get full history for commit info

      - name: 'Get commit hash'
        id: commit
        run: echo "short_sha=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - name: Download all prebuilds
        uses: actions/download-artifact@v4
        with:
          path: prebuilds/
          pattern: prebuilds-*
          merge-multiple: true
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: .
          name: builds
      
      - name: 'Create zip archives for prebuilds'
        run: |
          cd prebuilds
          for dir in */; do
            platform=$(basename "$dir")
            zip -r "../uni-node-${{ steps.commit.outputs.short_sha }}-${platform}.zip" "$dir"
          done
          cd ..
          ls -la uni-node-*.zip
      
      - name: 'Create Pre-release'
        uses: 'softprops/action-gh-release@v2'
        with:
          tag_name: 'pre-${{ steps.commit.outputs.short_sha }}'
          name: 'Pre-release ${{ steps.commit.outputs.short_sha }}'
          prerelease: true
          body: |
            Pre-release build from commit ${{ steps.commit.outputs.short_sha }}
            
            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
            **Trigger:** ${{ github.event_name }}
          files: |
            uni-${{ steps.commit.outputs.short_sha }}-darwin-amd64.gz
            uni-${{ steps.commit.outputs.short_sha }}-darwin-arm64.gz
            uni-${{ steps.commit.outputs.short_sha }}-linux-amd64.gz
            uni-${{ steps.commit.outputs.short_sha }}-linux-arm.gz
            uni-${{ steps.commit.outputs.short_sha }}-linux-arm64.gz
            uni-${{ steps.commit.outputs.short_sha }}-windows-amd64.exe.gz
            uni-${{ steps.commit.outputs.short_sha }}-windows-arm64.exe.gz
            uni-${{ steps.commit.outputs.short_sha }}-wasm.wasm.gz
            uni-node-${{ steps.commit.outputs.short_sha }}-win32-x64.zip
            uni-node-${{ steps.commit.outputs.short_sha }}-darwin-x64.zip
            uni-node-${{ steps.commit.outputs.short_sha }}-darwin-arm64.zip
            uni-node-${{ steps.commit.outputs.short_sha }}-linux-x64.zip
            uni-node-${{ steps.commit.outputs.short_sha }}-linux-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}